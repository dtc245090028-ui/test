# ============================================================
# nginx.conf — Cấu hình Nginx cho Frontend container
# ============================================================
# Nhiệm vụ:
#   1. Serve static files (HTML/JS/CSS) tại /usr/share/nginx/html
#   2. Reverse proxy các request /api/* → container backend:5000
#      → Frontend không cần biết địa chỉ thật của backend,
#        chỉ gọi /api/... và Nginx sẽ chuyển tiếp
# ============================================================

server {
    listen       80;
    server_name  localhost;

    # Charset mặc định UTF-8 để hiển thị tiếng Việt đúng
    charset utf-8;

    # --- Serve static frontend files ---
    location / {
        root   /usr/share/nginx/html;
        # Ưu tiên file chính xác → thư mục → 404
        try_files $uri $uri/ /index.html;
        index  index.html;
    }

    # --- Reverse proxy: /api/* → Flask backend ---
    # Nginx chuyển tiếp mọi request /api/... tới backend service
    # (tên "backend" là service name trong docker-compose.yml)
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;

        # Truyền đúng Host header để Flask nhận diện
        proxy_set_header   Host              $host;
        # Truyền IP thật của client (dùng trong audit log)
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout (AI endpoint có thể mất ~30s)
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --- Trang lỗi ---
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
