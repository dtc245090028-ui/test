<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nhà cung cấp — Quản lý Kho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="main-wrapper">
    <div id="topbar-container"></div>
    <main id="page-content">

      <!-- Thanh tìm kiếm + nút thêm mới -->
      <div class="card mb-3">
        <div class="card-body py-2">
          <div class="row g-2 align-items-center">
            <div class="col-12 col-md-4">
              <div class="input-group input-group-sm">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="search-input" class="form-control" placeholder="Tìm theo tên, email..."/>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <select id="status-filter" class="form-select form-select-sm">
                <option value="">Tất cả trạng thái</option>
                <option value="active">Đang hợp tác</option>
                <option value="inactive">Ngừng hợp tác</option>
              </select>
            </div>
            <div class="col-6 col-md-auto ms-md-auto">
              <button class="btn btn-primary btn-sm" id="btn-add" data-roles="admin,warehouse_manager">
                <i class="bi bi-plus-lg me-1"></i>Thêm nhà cung cấp
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Bảng danh sách -->
      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th style="width:60px">ID</th>
                  <th>Tên nhà cung cấp</th>
                  <th class="d-none d-md-table-cell">Đại diện</th>
                  <th class="d-none d-md-table-cell">Điện thoại</th>
                  <th class="d-none d-lg-table-cell">Email</th>
                  <th>Trạng thái</th>
                  <th class="table-actions">Hành động</th>
                </tr>
              </thead>
              <tbody id="suppliers-tbody">
                <tr><td colspan="7" class="text-center py-4 text-muted">Đang tải dữ liệu...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div id="pagination-container"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Thêm/Sửa NCC -->
  <div class="modal fade" id="supplier-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="supplier-modal-title">Thêm nhà cung cấp</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="form-error" class="alert alert-danger d-none py-2"></div>
          <form id="supplier-form" novalidate>
            <input type="hidden" id="supplier-id"/>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label required">Tên nhà cung cấp</label>
                <input type="text" id="f-name" class="form-control" placeholder="Tên công ty / cá nhân" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Người đại diện</label>
                <input type="text" id="f-contact" class="form-control" placeholder="Họ và tên người đại diện"/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Số điện thoại</label>
                <input type="tel" id="f-phone" class="form-control" placeholder="0901234567"/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" id="f-email" class="form-control" placeholder="contact@example.com"/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Mã số thuế</label>
                <input type="text" id="f-tax" class="form-control" placeholder="0312345678 (tùy chọn)"/>
              </div>
              <div class="col-12">
                <label class="form-label">Địa chỉ</label>
                <input type="text" id="f-address" class="form-control" placeholder="Địa chỉ nhà cung cấp"/>
              </div>
              <div class="col-md-4">
                <label class="form-label">Trạng thái</label>
                <select id="f-status" class="form-select">
                  <option value="active">Đang hợp tác</option>
                  <option value="inactive">Ngừng hợp tác</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-primary" id="btn-save">
            <span id="save-spinner" class="spinner-border spinner-border-sm me-1 d-none"></span>
            Lưu
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Xem chi tiết -->
  <div class="modal fade" id="detail-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Chi tiết nhà cung cấp</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detail-body">Đang tải...</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    /* ========= Quản lý Nhà cung cấp ========= */
    let currentPage = 1;
    const PAGE_SIZE = 20;
    const supplierModal = new bootstrap.Modal(document.getElementById('supplier-modal'));
    const detailModal   = new bootstrap.Modal(document.getElementById('detail-modal'));

    /* Tải danh sách nhà cung cấp */
    async function loadSuppliers(page = 1) {
      currentPage = page;
      const search = document.getElementById('search-input').value.trim();
      const status = document.getElementById('status-filter').value;

      document.getElementById('suppliers-tbody').innerHTML =
        '<tr><td colspan="7" class="text-center py-4 text-muted">Đang tải...</td></tr>';

      try {
        const data = await api.get('/suppliers', { search, status, page, page_size: PAGE_SIZE });
        renderTable(data.data || []);
        utils.renderPagination('pagination-container', data.total, page, PAGE_SIZE, loadSuppliers);
      } catch (err) {
        document.getElementById('suppliers-tbody').innerHTML =
          `<tr><td colspan="7" class="text-center py-4 text-danger">
            <i class="bi bi-exclamation-circle me-2"></i>Lỗi tải dữ liệu: ${utils.escapeHtml(err.message)}
          </td></tr>`;
      }
    }

    /* Render hàng bảng */
    function renderTable(items) {
      if (!items.length) {
        document.getElementById('suppliers-tbody').innerHTML =
          '<tr><td colspan="7" class="text-center py-4 text-muted">Không có dữ liệu</td></tr>';
        return;
      }
      const role = auth.getRole();
      const canEdit = ['admin','warehouse_manager'].includes(role);
      const canDelete = role === 'admin';

      document.getElementById('suppliers-tbody').innerHTML = items.map(s => `
        <tr>
          <td class="text-muted small">#${s.id}</td>
          <td><strong>${utils.escapeHtml(s.name)}</strong></td>
          <td class="d-none d-md-table-cell">${utils.escapeHtml(s.contact_person || '—')}</td>
          <td class="d-none d-md-table-cell">${utils.escapeHtml(s.phone || '—')}</td>
          <td class="d-none d-lg-table-cell">${utils.escapeHtml(s.email || '—')}</td>
          <td>${utils.statusBadge(s.status)}</td>
          <td class="table-actions">
            <button class="btn btn-outline-secondary btn-sm" onclick="viewDetail(${s.id})" title="Xem chi tiết">
              <i class="bi bi-eye"></i>
            </button>
            ${canEdit ? `<button class="btn btn-outline-primary btn-sm ms-1" onclick="openEdit(${s.id})" title="Sửa">
              <i class="bi bi-pencil"></i>
            </button>` : ''}
            ${canDelete ? `<button class="btn btn-outline-danger btn-sm ms-1" onclick="deleteSupplier(${s.id}, '${utils.escapeHtml(s.name)}')" title="Xóa/Ngừng hợp tác">
              <i class="bi bi-trash"></i>
            </button>` : ''}
          </td>
        </tr>`).join('');
    }

    /* Xem chi tiết */
    async function viewDetail(id) {
      document.getElementById('detail-body').innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>';
      detailModal.show();
      try {
        const s = await api.get(`/suppliers/${id}`);
        document.getElementById('detail-body').innerHTML = `
          <table class="table table-borderless mb-0">
            <tr><th class="w-40">Tên:</th><td>${utils.escapeHtml(s.name)}</td></tr>
            <tr><th>Đại diện:</th><td>${utils.escapeHtml(s.contact_person || '—')}</td></tr>
            <tr><th>Điện thoại:</th><td>${utils.escapeHtml(s.phone || '—')}</td></tr>
            <tr><th>Email:</th><td>${utils.escapeHtml(s.email || '—')}</td></tr>
            <tr><th>Địa chỉ:</th><td>${utils.escapeHtml(s.address || '—')}</td></tr>
            <tr><th>Mã số thuế:</th><td>${utils.escapeHtml(s.tax_code || '—')}</td></tr>
            <tr><th>Trạng thái:</th><td>${utils.statusBadge(s.status)}</td></tr>
          </table>`;
      } catch (err) {
        document.getElementById('detail-body').innerHTML = `<div class="text-danger">Lỗi: ${utils.escapeHtml(err.message)}</div>`;
      }
    }

    /* Mở modal thêm mới */
    document.getElementById('btn-add').addEventListener('click', () => {
      document.getElementById('supplier-modal-title').textContent = 'Thêm nhà cung cấp mới';
      document.getElementById('supplier-form').reset();
      document.getElementById('supplier-id').value = '';
      document.getElementById('form-error').classList.add('d-none');
      supplierModal.show();
    });

    /* Mở modal sửa */
    async function openEdit(id) {
      document.getElementById('supplier-modal-title').textContent = 'Cập nhật nhà cung cấp';
      document.getElementById('form-error').classList.add('d-none');
      supplierModal.show();
      try {
        const s = await api.get(`/suppliers/${id}`);
        document.getElementById('supplier-id').value = s.id;
        document.getElementById('f-name').value    = s.name || '';
        document.getElementById('f-contact').value = s.contact_person || '';
        document.getElementById('f-phone').value   = s.phone || '';
        document.getElementById('f-email').value   = s.email || '';
        document.getElementById('f-tax').value     = s.tax_code || '';
        document.getElementById('f-address').value = s.address || '';
        document.getElementById('f-status').value  = s.status || 'active';
      } catch (err) {
        supplierModal.hide();
        utils.showToast('Không thể tải thông tin nhà cung cấp: ' + err.message, 'danger');
      }
    }

    /* Lưu (thêm/sửa) */
    document.getElementById('btn-save').addEventListener('click', async () => {
      const id   = document.getElementById('supplier-id').value;
      const name = document.getElementById('f-name').value.trim();
      const email = document.getElementById('f-email').value.trim();
      const errDiv = document.getElementById('form-error');
      errDiv.classList.add('d-none');

      if (!name) {
        errDiv.textContent = 'Tên nhà cung cấp không được để trống.';
        errDiv.classList.remove('d-none');
        return;
      }
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errDiv.textContent = 'Địa chỉ email không hợp lệ.';
        errDiv.classList.remove('d-none');
        return;
      }

      const body = {
        name,
        contact_person: document.getElementById('f-contact').value.trim() || undefined,
        phone:    document.getElementById('f-phone').value.trim()   || undefined,
        email:    email || undefined,
        tax_code: document.getElementById('f-tax').value.trim()     || undefined,
        address:  document.getElementById('f-address').value.trim() || undefined,
        status:   document.getElementById('f-status').value,
      };

      /* Bật spinner */
      document.getElementById('save-spinner').classList.remove('d-none');
      document.getElementById('btn-save').disabled = true;

      try {
        if (id) {
          await api.put(`/suppliers/${id}`, body);
          utils.showToast('Cập nhật nhà cung cấp thành công!', 'success');
        } else {
          await api.post('/suppliers', body);
          utils.showToast('Thêm nhà cung cấp thành công!', 'success');
        }
        supplierModal.hide();
        loadSuppliers(currentPage);
      } catch (err) {
        errDiv.textContent = 'Lỗi: ' + err.message;
        errDiv.classList.remove('d-none');
      } finally {
        document.getElementById('save-spinner').classList.add('d-none');
        document.getElementById('btn-save').disabled = false;
      }
    });

    /* Xóa / ngừng hợp tác */
    async function deleteSupplier(id, name) {
      const ok = await utils.confirmDialog(
        'Xóa nhà cung cấp',
        `Bạn có chắc muốn xóa (ngừng hợp tác) nhà cung cấp "${name}" không?`
      );
      if (!ok) return;
      try {
        await api.delete(`/suppliers/${id}`);
        utils.showToast('Đã xóa nhà cung cấp thành công!', 'success');
        loadSuppliers(currentPage);
      } catch (err) {
        utils.showToast('Lỗi xóa nhà cung cấp: ' + err.message, 'danger');
      }
    }

    /* Debounce tìm kiếm */
    document.getElementById('search-input').addEventListener('input',
      utils.debounce(() => loadSuppliers(1), 400));
    document.getElementById('status-filter').addEventListener('change', () => loadSuppliers(1));

    /* Khởi tải */
    document.addEventListener('DOMContentLoaded', () => {
      setPageTitle('Nhà cung cấp');
      loadSuppliers(1);
    });
  </script>
</body>
</html>
