<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hóa đơn & Công nợ — Quản lý Kho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="main-wrapper">
    <div id="topbar-container"></div>
    <main id="page-content">

      <!-- Tabs: Hóa đơn / Thanh toán -->
      <ul class="nav nav-tabs mb-3" id="invoice-tabs">
        <li class="nav-item">
          <button class="nav-link active" data-tab="invoices">
            <i class="bi bi-receipt me-1"></i>Hóa đơn NCC
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="payments">
            <i class="bi bi-cash-coin me-1"></i>Ghi nhận thanh toán
          </button>
        </li>
      </ul>

      <!-- Tab Hóa đơn -->
      <div id="tab-invoices">
        <div class="card mb-3">
          <div class="card-body py-2">
            <div class="row g-2 align-items-center">
              <div class="col-6 col-md-3">
                <input type="number" id="inv-supplier-filter" class="form-control form-control-sm" placeholder="ID Nhà cung cấp"/>
              </div>
              <div class="col-6 col-md-3">
                <select id="inv-status-filter" class="form-select form-select-sm">
                  <option value="">Tất cả trạng thái TT</option>
                  <option value="chưa thanh toán">Chưa thanh toán</option>
                  <option value="thanh toán một phần">Thanh toán một phần</option>
                  <option value="đã thanh toán">Đã thanh toán</option>
                </select>
              </div>
              <div class="col-auto ms-md-auto" data-roles="admin,warehouse_manager">
                <button class="btn btn-primary btn-sm" id="btn-add-invoice">
                  <i class="bi bi-plus-lg me-1"></i>Tạo hóa đơn
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead>
                  <tr>
                    <th>Số HĐ</th>
                    <th>NCC ID</th>
                    <th>Phiếu nhập ID</th>
                    <th>Ngày xuất</th>
                    <th>Tổng tiền</th>
                    <th>Đã thanh toán</th>
                    <th>Trạng thái TT</th>
                    <th class="table-actions">Hành động</th>
                  </tr>
                </thead>
                <tbody id="invoices-tbody">
                  <tr><td colspan="8" class="text-center py-4 text-muted">Đang tải...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="card-footer"><div id="inv-pagination"></div></div>
        </div>
      </div>

      <!-- Tab Thanh toán -->
      <div id="tab-payments" class="d-none">
        <div class="card">
          <div class="card-header">Ghi nhận thanh toán hóa đơn</div>
          <div class="card-body">
            <div id="pay-error" class="alert alert-danger d-none py-2"></div>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label required">ID Hóa đơn</label>
                <input type="number" id="p-invoice-id" class="form-control" min="1" placeholder="ID hóa đơn"/>
              </div>
              <div class="col-md-4">
                <label class="form-label required">Số tiền thanh toán (VND)</label>
                <input type="number" id="p-amount" class="form-control" min="1" placeholder="Số tiền"/>
              </div>
              <div class="col-md-4">
                <label class="form-label required">Ngày thanh toán</label>
                <input type="datetime-local" id="p-date" class="form-control"/>
              </div>
              <div class="col-md-4">
                <label class="form-label">Phương thức</label>
                <select id="p-method" class="form-select">
                  <option value="chuyển khoản">Chuyển khoản</option>
                  <option value="tiền mặt">Tiền mặt</option>
                  <option value="séc">Séc</option>
                </select>
              </div>
              <div class="col-12">
                <button class="btn btn-success" id="btn-pay">
                  <span id="pay-spinner" class="spinner-border spinner-border-sm me-1 d-none"></span>
                  <i class="bi bi-cash-coin me-1"></i>Ghi nhận thanh toán
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Tạo hóa đơn -->
  <div class="modal fade" id="invoice-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Tạo hóa đơn nhà cung cấp</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="inv-form-error" class="alert alert-danger d-none py-2"></div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label required">ID Nhà cung cấp</label>
              <input type="number" id="f-supplier" class="form-control" min="1"/>
            </div>
            <div class="col-md-6">
              <label class="form-label">ID Phiếu nhập</label>
              <input type="number" id="f-receipt" class="form-control" min="1" placeholder="Tùy chọn"/>
            </div>
            <div class="col-md-6">
              <label class="form-label required">Số hóa đơn</label>
              <input type="text" id="f-inv-number" class="form-control" placeholder="INV-2026-001"/>
            </div>
            <div class="col-md-6">
              <label class="form-label required">Ngày xuất hóa đơn</label>
              <input type="datetime-local" id="f-issue-date" class="form-control"/>
            </div>
            <div class="col-12">
              <label class="form-label required">Tổng tiền (VND)</label>
              <input type="number" id="f-total" class="form-control" min="1" placeholder="Tổng giá trị hóa đơn"/>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-primary" id="btn-save-invoice">
            <span id="inv-spinner" class="spinner-border spinner-border-sm me-1 d-none"></span>Tạo hóa đơn
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal chi tiết hóa đơn -->
  <div class="modal fade" id="inv-detail-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="inv-detail-title">Chi tiết hóa đơn</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="inv-detail-body">Đang tải...</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    /* ========= Hóa đơn & Công nợ ========= */
    let currentPage = 1;
    const PAGE_SIZE = 20;
    const invoiceModal  = new bootstrap.Modal(document.getElementById('invoice-modal'));
    const invDetailModal = new bootstrap.Modal(document.getElementById('inv-detail-modal'));

    /* Tab switching */
    document.querySelectorAll('#invoice-tabs .nav-link').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#invoice-tabs .nav-link').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-invoices').classList.add('d-none');
        document.getElementById('tab-payments').classList.add('d-none');
        document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('d-none');
      });
    });

    /* Tải danh sách hóa đơn */
    async function loadInvoices(page = 1) {
      currentPage = page;
      const supplier_id     = document.getElementById('inv-supplier-filter').value;
      const payment_status  = document.getElementById('inv-status-filter').value;
      document.getElementById('invoices-tbody').innerHTML =
        '<tr><td colspan="8" class="text-center py-4 text-muted">Đang tải...</td></tr>';
      try {
        const data = await api.get('/supplier-invoices', { supplier_id, payment_status, page, page_size: PAGE_SIZE });
        renderInvoices(data.data || []);
        utils.renderPagination('inv-pagination', data.total, page, PAGE_SIZE, loadInvoices);
      } catch (err) {
        document.getElementById('invoices-tbody').innerHTML =
          `<tr><td colspan="8" class="text-danger text-center py-4">Lỗi: ${utils.escapeHtml(err.message)}</td></tr>`;
      }
    }

    function renderInvoices(items) {
      if (!items.length) {
        document.getElementById('invoices-tbody').innerHTML =
          '<tr><td colspan="8" class="text-center py-4 text-muted">Không có dữ liệu</td></tr>';
        return;
      }
      document.getElementById('invoices-tbody').innerHTML = items.map(inv => `
        <tr>
          <td><strong>${utils.escapeHtml(inv.invoice_number)}</strong></td>
          <td>${inv.supplier_id}</td>
          <td>${inv.receipt_id || '—'}</td>
          <td>${utils.formatDate(inv.issue_date)}</td>
          <td class="fw-bold">${utils.formatCurrency(inv.total_amount)}</td>
          <td>${utils.formatCurrency(inv.paid_amount)}</td>
          <td>${utils.paymentBadge(inv.payment_status)}</td>
          <td class="table-actions">
            <button class="btn btn-outline-secondary btn-sm" onclick="viewInvDetail(${inv.id})" title="Chi tiết">
              <i class="bi bi-eye"></i>
            </button>
          </td>
        </tr>`).join('');
    }

    async function viewInvDetail(id) {
      document.getElementById('inv-detail-body').innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>';
      document.getElementById('inv-detail-title').textContent = `Hóa đơn #${id}`;
      invDetailModal.show();
      try {
        const inv = await api.get(`/supplier-invoices/${id}`);
        const paymentsHtml = (inv.payments || []).map((p, i) => `
          <tr>
            <td>${i+1}</td>
            <td>${utils.formatDate(p.payment_date)}</td>
            <td>${utils.formatCurrency(p.amount)}</td>
            <td>${utils.escapeHtml(p.method)}</td>
          </tr>`).join('');
        const remaining = inv.total_amount - inv.paid_amount;
        document.getElementById('inv-detail-body').innerHTML = `
          <div class="row mb-3">
            <div class="col-md-6">
              <table class="table table-borderless mb-0 small">
                <tr><th>Số HĐ:</th><td>${utils.escapeHtml(inv.invoice_number)}</td></tr>
                <tr><th>NCC ID:</th><td>${inv.supplier_id}</td></tr>
                <tr><th>Phiếu nhập ID:</th><td>${inv.receipt_id || '—'}</td></tr>
                <tr><th>Ngày xuất:</th><td>${utils.formatDate(inv.issue_date)}</td></tr>
              </table>
            </div>
            <div class="col-md-6">
              <table class="table table-borderless mb-0 small">
                <tr><th>Tổng tiền:</th><td class="fw-bold">${utils.formatCurrency(inv.total_amount)}</td></tr>
                <tr><th>Đã thanh toán:</th><td class="text-success">${utils.formatCurrency(inv.paid_amount)}</td></tr>
                <tr><th>Còn nợ:</th><td class="${remaining > 0 ? 'text-danger fw-bold' : ''}">${utils.formatCurrency(remaining)}</td></tr>
                <tr><th>Trạng thái:</th><td>${utils.paymentBadge(inv.payment_status)}</td></tr>
              </table>
            </div>
          </div>
          ${paymentsHtml ? `
          <h6>Lịch sử thanh toán</h6>
          <div class="table-responsive">
            <table class="table table-sm table-bordered">
              <thead class="table-light"><tr><th>#</th><th>Ngày TT</th><th>Số tiền</th><th>Phương thức</th></tr></thead>
              <tbody>${paymentsHtml}</tbody>
            </table>
          </div>` : '<p class="text-muted small">Chưa có lịch sử thanh toán.</p>'}`;
      } catch (err) {
        document.getElementById('inv-detail-body').innerHTML = `<div class="text-danger">Lỗi: ${utils.escapeHtml(err.message)}</div>`;
      }
    }

    /* Modal tạo hóa đơn */
    document.getElementById('btn-add-invoice').addEventListener('click', () => {
      document.getElementById('f-supplier').value = '';
      document.getElementById('f-receipt').value = '';
      document.getElementById('f-inv-number').value = '';
      document.getElementById('f-issue-date').value = new Date().toISOString().slice(0, 16);
      document.getElementById('f-total').value = '';
      document.getElementById('inv-form-error').classList.add('d-none');
      invoiceModal.show();
    });

    document.getElementById('btn-save-invoice').addEventListener('click', async () => {
      const supplier_id    = document.getElementById('f-supplier').value;
      const receipt_id     = document.getElementById('f-receipt').value;
      const invoice_number = document.getElementById('f-inv-number').value.trim();
      const issue_date     = document.getElementById('f-issue-date').value;
      const total_amount   = parseFloat(document.getElementById('f-total').value);
      const errDiv = document.getElementById('inv-form-error');
      errDiv.classList.add('d-none');

      if (!supplier_id || !invoice_number || !issue_date || isNaN(total_amount) || total_amount <= 0) {
        errDiv.textContent = 'Vui lòng điền đầy đủ: NCC, số hóa đơn, ngày, tổng tiền > 0.';
        errDiv.classList.remove('d-none');
        return;
      }

      document.getElementById('inv-spinner').classList.remove('d-none');
      document.getElementById('btn-save-invoice').disabled = true;
      try {
        const body = { supplier_id: parseInt(supplier_id), invoice_number, issue_date: new Date(issue_date).toISOString(), total_amount };
        if (receipt_id) body.receipt_id = parseInt(receipt_id);
        await api.post('/supplier-invoices', body);
        utils.showToast('Tạo hóa đơn thành công!', 'success');
        invoiceModal.hide();
        loadInvoices(currentPage);
      } catch (err) {
        errDiv.textContent = 'Lỗi: ' + err.message;
        errDiv.classList.remove('d-none');
      } finally {
        document.getElementById('inv-spinner').classList.add('d-none');
        document.getElementById('btn-save-invoice').disabled = false;
      }
    });

    /* Ghi nhận thanh toán */
    document.getElementById('p-date').value = new Date().toISOString().slice(0, 16);

    document.getElementById('btn-pay').addEventListener('click', async () => {
      const invoice_id   = document.getElementById('p-invoice-id').value;
      const amount       = parseFloat(document.getElementById('p-amount').value);
      const payment_date = document.getElementById('p-date').value;
      const method       = document.getElementById('p-method').value;
      const errDiv = document.getElementById('pay-error');
      errDiv.classList.add('d-none');

      if (!invoice_id || isNaN(amount) || amount <= 0 || !payment_date) {
        errDiv.textContent = 'Vui lòng nhập đầy đủ ID hóa đơn, số tiền > 0, ngày thanh toán.';
        errDiv.classList.remove('d-none');
        return;
      }

      document.getElementById('pay-spinner').classList.remove('d-none');
      document.getElementById('btn-pay').disabled = true;
      try {
        const result = await api.post('/supplier-payments', {
          invoice_id: parseInt(invoice_id), amount, payment_date: new Date(payment_date).toISOString(), method,
        });
        utils.showToast(`Ghi nhận thanh toán thành công! Trạng thái HĐ: ${result.invoice_payment_status}`, 'success');
        document.getElementById('p-invoice-id').value = '';
        document.getElementById('p-amount').value = '';
        loadInvoices(currentPage);
      } catch (err) {
        let msg = err.message;
        if (err.error_code === 'OVERPAYMENT') msg = 'Số tiền thanh toán vượt quá tổng tiền hóa đơn.';
        if (err.error_code === 'INVOICE_ALREADY_PAID') msg = 'Hóa đơn này đã được thanh toán đầy đủ.';
        errDiv.textContent = 'Lỗi: ' + msg;
        errDiv.classList.remove('d-none');
      } finally {
        document.getElementById('pay-spinner').classList.add('d-none');
        document.getElementById('btn-pay').disabled = false;
      }
    });

    document.getElementById('inv-supplier-filter').addEventListener('input', utils.debounce(() => loadInvoices(1), 400));
    document.getElementById('inv-status-filter').addEventListener('change', () => loadInvoices(1));

    document.addEventListener('DOMContentLoaded', () => {
      setPageTitle('Hóa đơn & Công nợ');
      loadInvoices(1);
    });
  </script>
</body>
</html>
